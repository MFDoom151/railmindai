# Render Blueprint: New → Blueprint → выбрать репозиторий. Секреты генерируются автоматически.
services:
  - type: web
    name: railtwin-digital-station
    runtime: docker
    plan: free            # для комфортного CP-SAT лучше starter (0.5 CPU → 1 CPU)
    healthCheckPath: /health
    envVars:
      - key: RAILTWIN_DEV
        value: "0"
      - key: RAILTWIN_OPEN_DEMO          # 0 — без входа только просмотр; жюри входит под демо-диспетчером (backend/config/demo_users.yaml)
        value: "0"
      - key: RAILTWIN_SECRET
        generateValue: true
      - key: RAILTWIN_ADMIN_USER
        value: admin
      - key: RAILTWIN_ADMIN_PASSWORD
        generateValue: true               # смотреть в Dashboard → Environment
      - key: RAILTWIN__planner__workers
        value: "2"
      - key: RAILTWIN__planner__time_limit_s
        value: "1.5"
