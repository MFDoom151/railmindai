# Конфигурация «Цифровой станции». Меняется без перекомпиляции:
#  - правкой этого файла (перезапуск или POST /api/v1/config/reload),
#  - через API: PUT /api/v1/config (роль admin) — изменения пишутся в data/config.override.yaml и применяются «на лету».
# Секреты (пароли, ключ подписи токенов) здесь НЕ хранятся — только в переменных окружения (см. README).

sim:
  tick_hz: 2                 # частота потока данных, Гц (>= 1)
  time_scale: 1.0            # минут модельного времени за 1 с реального
  horizon_min: 480           # на сколько минут вперёд держим расписание
  seed: 42
  noise:                     # имитация «грязного» канала: проверяется ingest-слоем
    dup_rate: 0.03           # дубликаты
    invalid_rate: 0.01       # некорректные значения
    reorder_rate: 0.05       # события не по порядку
    drop_rate: 0.01          # потери
    jitter_m: 3.0            # шум координаты, м

ingest:
  ema_alpha: 0.55            # сглаживание координат/скорости (1 = без сглаживания)
  reorder_window_ms: 120     # буфер переупорядочивания (добавляет к задержке не более этого значения)
  dedup_window: 8000         # окно дедупликации (число событий)
  stale_after_s: 4.0         # «нет данных» по сущности

index:                       # индекс эффективности станции: 100 * sum(w_k * f_k), f_k in [0,1]
  weights:
    throughput: 0.18         # пропускная способность (обработано / запланировано)
    avg_dev: 0.18            # среднее отклонение от графика (с учётом приоритетов)
    max_dev: 0.07            # наибольшее отклонение
    track_load: 0.12         # загрузка путей (оптимум — рабочий диапазон)
    conflicts: 0.18          # число и тяжесть конфликтов
    queue_outside: 0.07      # поезда, ожидающие приёма на подходе
    loco_idle: 0.10          # простой/дефицит локомотивов
    crew_idle: 0.10          # простой/дефицит бригад
  thresholds:                # категории
    norm: 75                 # >= 75 — «Норма»
    attention: 50            # 50..75 — «Внимание», ниже — «Критично»
  letters: {A: 90, B: 80, C: 65, D: 50}
  params:
    dev_good: 2.0            # мин: отклонение без штрафа
    dev_bad: 30.0            # мин: отклонение с полным штрафом
    maxdev_good: 5.0
    maxdev_bad: 60.0
    util_lo: 0.30            # нижняя граница рабочей загрузки путей
    util_hi: 0.75            # верхняя граница
    util_bad: 0.95           # загрузка с полным штрафом
    conflicts_cap: 6.0       # взвешенное число конфликтов с полным штрафом
    queue_cap: 4.0
    res_lo: 0.25             # загрузка локомотива/бригады: ниже — простой (мягкий штраф)
    res_hi: 0.85             # выше — дефицит ресурса (штраф растёт до res_bad)
    res_bad: 1.0
    res_idle_floor: 0.5      # оценка при полном простое
    throughput_floor: 0.6    # доля выполнения плана, ниже которой штраф полный

planner:
  engine: cpsat              # cpsat | heuristic
  time_limit_s: 1.5          # лимит времени на один вариант
  workers: 4
  horizon_min: 480
  headway_min: 2             # интервал безопасности между поездами на пути
  route_in_min: 3            # занятие входной горловины маршрутом приёма
  route_out_min: 3           # занятие выходной горловины маршрутом отправления
  shunt_move_min: 4          # занятие горловины манёвровым передвижением
  readiness_min: 5           # готовность к отправлению после последней операции
  w_late: 1.0                # вес опоздания отправления (мин * приоритет)
  w_wait: 0.6                # вес ожидания приёма на подходе
  w_change: 3.0              # штраф за смену пути относительно текущего плана (устойчивость)
  priority_weights: {1: 1, 2: 2, 3: 4, 4: 7, 5: 12}
  freight_on_platform: false # грузовые поезда не занимают пассажирские платформы
  auto_apply: false          # применять рекомендованный вариант автоматически

conflicts:
  late_warn_min: 8           # опоздание отправления: предупреждение
  late_crit_min: 20          # опоздание отправления: критично
  eta_replan_min: 4          # изменение прогноза прибытия, запускающее перепланирование

storage:
  history_interval_s: 5      # шаг записи снимков в БД
  retention_h: 72            # срок хранения истории
  db_path: data/railtwin.db
  replay_buffer_s: 900       # перемотка в памяти: последние 15 минут

platforms:                   # число пассажирских платформенных путей (первые приёмо-отправочные)
  default: 1
  almaty1: 2
  astana: 3
  shymkent: 2
  karaganda: 1
  pavlodar: 1
  shu: 1
  aktau: 1
  petropavlovsk: 1
  altynkol: 0
  dostyk: 1
  kopa: 0
  otar: 0
  shamalgan: 0

maintenance:                 # окна технического обслуживания путей (минуты суток от-до), повторяются ежедневно
  default: [{track: 2, from: "13:30", to: "14:30"}]
  otar: [{track: 3, from: "12:30", to: "13:45"}]
  kopa: []
  shamalgan: []
